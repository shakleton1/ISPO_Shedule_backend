  /api/v1/admin/import/plx-curriculum/xlsx:
    post:
      tags: [Администрирование]
      summary: Импортировать учебный план и академический календарь из PLX/XLSX
      description: >
        Разбирает книги в стиле PLX с листами "План" и "График".
        Создает или обновляет специальность, учебный план, элементы учебного плана,
        распределения по семестрам, дисциплины и академический календарь учебного плана.
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                specialty_code:
                  type: string
                  description: Необязательно; определяется из имени файла, например 09.02.01_24_11.plx.xlsx.
                specialty_name: { type: string }
                admission_year:
                  type: integer
                  minimum: 2000
                  maximum: 2100
                  description: Необязательно; определяется из части имени файла, например _24_.
                base_grade:
                  type: integer
                  enum: [9, 11]
                  description: Необязательно; определяется из части имени файла, например _11.
                variant:
                  type: string
                  description: По умолчанию base_9/base_11 или plx.
                academic_year_start:
                  type: string
                  format: date
                  description: По умолчанию 2026-09-01.
                replace:
                  type: boolean
                  description: По умолчанию true; очищает существующие элементы и календарь того же года для учебного плана.
      responses:
        "200":
          description: Успешно
