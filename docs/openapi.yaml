components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key

  parameters:
    Limit:
      in: query
      name: limit
      required: false
      description: |
        Лимит пагинации. Если он не указан, пагинация отключена и метод может вернуть полный список.
        Максимум: 500.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    Offset:
      in: query
      name: offset
      required: false
      description: Смещение пагинации (с нуля). Используется только если указан `limit`.
      schema:
        type: integer
        minimum: 0

  responses:
    BadRequest:
      description: Неверный запрос
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Доступ запрещен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Не найдено
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Конфликт
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MethodNotAllowed:
      description: Метод не разрешен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalServerError:
      description: Внутренняя ошибка сервера
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailable:
      description: Сервис недоступен
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [code, field, message]
      properties:
        code:
          type: string
          description: Стабильный машиночитаемый код ошибки
        field:
          type: string
          description: Имя поля, связанного с ошибкой (может быть пустым)
        message:
          type: string
          description: Человекочитаемое сообщение об ошибке

    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status: { type: string }
        time: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required:
        [access_token, expires_at, refresh_token, refresh_expires_at, role]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }
        role:
          type: string
          enum: [student, dispatcher, admin, viewer]

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    RefreshResponse:
      type: object
      required: [access_token, expires_at, refresh_token, refresh_expires_at]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expires_at: { type: string, format: date-time }

    MeResponse:
      type: object
      required: [id, login, role]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        role:
          type: string
          enum: [student, dispatcher, admin, viewer]
        group_id: { type: integer, nullable: true }
        subgroup: { type: integer, nullable: true }

    Group:
      type: object
      required: [id, name, course]
      properties:
        id: { type: integer }
        name: { type: string }
        course: { type: integer }
        schedule_source_group_id: { type: integer, nullable: true }
        curriculum_id: { type: integer, format: int64, nullable: true }
        admission_year: { type: integer, nullable: true }
        specialty_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Specialty:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Curriculum:
      type: object
      required: [id, specialty_id, admission_year, variant, title, is_active]
      properties:
        id: { type: integer, format: int64 }
        specialty_id: { type: integer }
        admission_year: { type: integer }
        variant: { type: string }
        title: { type: string }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AcademicCalendar:
      type: object
      required: [id, curriculum_id, academic_year_start, weeks_total]
      properties:
        id: { type: integer, format: int64 }
        curriculum_id: { type: integer, format: int64 }
        academic_year_start:
          type: string
          format: date
          description: Дата начала учебного года (YYYY-MM-DD)
        weeks_total: { type: integer }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AcademicCalendarWeek:
      type: object
