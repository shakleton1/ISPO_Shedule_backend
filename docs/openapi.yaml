components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    HealthResponse:
      type: object
      required: [status, time]
      properties:
        status: { type: string }
        time: { type: string }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string }
        password: { type: string }

    LoginResponse:
      type: object
      required: [access_token, expires_at, role]
      properties:
        access_token: { type: string }
        expires_at: { type: string, format: date-time }
        role:
          type: string
          enum: [student, dispatcher, admin, viewer]

    MeResponse:
      type: object
      required: [id, login, role]
      properties:
        id: { type: integer, format: int64 }
        login: { type: string }
        role:
          type: string
          enum: [student, dispatcher, admin, viewer]
        group_id: { type: integer, nullable: true }
        subgroup: { type: integer, nullable: true }

    Group:
      type: object
      required: [id, name, course]
      properties:
        id: { type: integer }
        name: { type: string }
        course: { type: integer }
        curriculum_id: { type: integer, format: int64, nullable: true }
        admission_year: { type: integer, nullable: true }
        specialty_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Specialty:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Curriculum:
      type: object
      required: [id, specialty_id, admission_year, variant, title, is_active]
      properties:
        id: { type: integer, format: int64 }
        specialty_id: { type: integer }
        admission_year: { type: integer }
        variant: { type: string }
        title: { type: string }
        notes: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AcademicCalendar:
      type: object
      required: [id, curriculum_id, academic_year_start, weeks_total]
      properties:
        id: { type: integer, format: int64 }
        curriculum_id: { type: integer, format: int64 }
        academic_year_start:
          type: string
          format: date
          description: Academic year start date (YYYY-MM-DD)
        weeks_total: { type: integer }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AcademicCalendarWeek:
      type: object
      required:
        [
          id,
          calendar_id,
          week_number,
          week_start_date,
          activity_code,
          is_teaching,
        ]
      properties:
        id: { type: integer, format: int64 }
        calendar_id: { type: integer, format: int64 }
        week_number: { type: integer }
        week_start_date:
          type: string
          format: date
          description: Week start date (YYYY-MM-DD)
        activity_code: { type: string }
        activity_name: { type: string, nullable: true }
        is_teaching: { type: boolean }
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CurriculumItem:
      type: object
      required: [id, curriculum_id, item_type, name]
      properties:
        id: { type: integer, format: int64 }
        curriculum_id: { type: integer, format: int64 }
        parent_id: { type: integer, format: int64, nullable: true }
        index_code: { type: string, nullable: true, maxLength: 30 }
        item_type:
          type: string
          enum: [DISCIPLINE, PRACTICE, ATTESTATION, GIA, VACATION, OTHER]
        name: { type: string }
        subject_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    CurriculumItemTreeNode:
      allOf:
        - $ref: "#/components/schemas/CurriculumItem"
        - type: object
          required: [children]
          properties:
            children:
              type: array
              items: { $ref: "#/components/schemas/CurriculumItemTreeNode" }

    CurriculumItemAllocation:
      type: object
      required: [id, item_id, semester]
      properties:
        id: { type: integer, format: int64 }
        item_id: { type: integer, format: int64 }
        semester: { type: integer }
        weeks: { type: integer, nullable: true }
        hours_total: { type: integer, nullable: true }
        hours_lectures: { type: integer, nullable: true }
        hours_practice: { type: integer, nullable: true }
        hours_lab: { type: integer, nullable: true }
        hours_independent: { type: integer, nullable: true }
        hours_exam: { type: integer, nullable: true }
        assessment_type:
          type: string
          nullable: true
          enum: [EXAM, CREDIT, GRADED_CREDIT, MODULE_EXAM]
        comment: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Subject:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        short_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Location:
      type: object
      required: [id, name, is_virtual]
      properties:
        id: { type: integer }
        name: { type: string }
        is_virtual: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Teacher:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TeacherSubject:
      type: object
      required: [teacher_id, subject_id]
      properties:
        teacher_id: { type: integer }
        subject_id: { type: integer }

    CourseAssignment:
      type: object
      required: [id, group_id, semester, subject_id]
      properties:
        id: { type: integer, format: int64 }
        group_id: { type: integer }
        semester: { type: integer, minimum: 1, maximum: 12 }
        subject_id: { type: integer }
        status: { type: string, enum: [draft, published] }
        teacher_id: { type: integer, nullable: true }
        location_id: { type: integer, nullable: true }
        curriculum_item_id: { type: integer, format: int64, nullable: true }
        subgroup: { type: integer, nullable: true, enum: [1, 2] }
        notes: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    TemplateView:
      type: object
      required:
        [
          pair_number,
          subject_id,
          subject_name,
          location_id,
          location_name,
          teacher_name,
        ]
      properties:
        pair_number: { type: integer }
        subject_id: { type: integer }
        subject_name: { type: string }
        location_id: { type: integer }
        location_name: { type: string }
        teacher_name: { type: string }
        teacher_manual: { type: boolean }
        location_manual: { type: boolean }
        subgroup: { type: integer, nullable: true, enum: [1, 2] }

    OverrideView:
      type: object
      required: [id, pair_number, action_type, updated_at]
      properties:
        id: { type: integer, format: int64 }
        pair_number: { type: integer }
        action_type:
          type: string
          enum: [CANCEL, REPLACE, ADD]
        new_subject_id: { type: integer, nullable: true }
        new_subject_name: { type: string }
        new_location_id: { type: integer, nullable: true }
        new_location_name: { type: string }
        new_teacher_manual: { type: boolean }
        new_teacher_name: { type: string, nullable: true }
        comment: { type: string, nullable: true }
        subgroup: { type: integer, nullable: true, enum: [1, 2] }
        updated_at: { type: string, format: date-time }

    Lesson:
      type: object
      required:
        [
          pair_number,
          subject_name,
          location_name,
          teacher_name,
          is_changed,
          is_added,
        ]
      properties:
        pair_number: { type: integer }
        subject_id: { type: integer, nullable: true }
        subject_name: { type: string }
        location_id: { type: integer, nullable: true }
        location_name: { type: string }
        teacher_name: { type: string }
        subgroup: { type: integer, nullable: true }
        is_changed: { type: boolean }
        is_added: { type: boolean }
        comment: { type: string, nullable: true }

    DaySchedule:
      type: object
      required: [date, day_of_week, week_parity, lessons, events]
      properties:
        date: { type: string, format: date }
        day_of_week: { type: integer, minimum: 0, maximum: 5 }
        week_parity:
          type: string
          enum: [numerator, denominator, both]
        overlay_text: { type: string, nullable: true }
        events:
          type: array
          items: { $ref: "#/components/schemas/DayEvent" }
        lessons:
          type: array
          items: { $ref: "#/components/schemas/Lesson" }

