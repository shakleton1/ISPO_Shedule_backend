openapi: 3.0.3
info:
  title: API умного расписания ИСПО
  version: 1.0.0
  description: |
    API бэкенда для системы "Умное расписание" (ИСПО СПбПУ).

servers:
  - url: http://localhost:8080

tags:
  - name: Состояние
  - name: Авторизация
  - name: Расписание
  - name: Пуш-уведомления
  - name: Справочники
  - name: Администрирование
  - name: Мониторинг

paths:
  /metrics:
    get:
      tags: [Мониторинг]
      summary: Метрики Prometheus
      responses:
        "200":
          description: Текстовые метрики Prometheus
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [Мониторинг]
      summary: Спецификация OpenAPI (YAML)
      responses:
        "200":
          description: YAML-файл OpenAPI
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/health:
    get:
      tags: [Состояние]
      summary: Состояние сервиса
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/metrics/health:
    get:
      tags: [Мониторинг]
      summary: Состояние метрик и БД
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /api/v1/auth/login:
    post:
      tags: [Авторизация]
      summary: Войти и получить JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [Авторизация]
      summary: Обновить токен обновления и получить новый JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [Авторизация]
      summary: Отозвать токен обновления
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Нет содержимого
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/me:
    get:
      tags: [Авторизация]
      summary: Текущий пользователь
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/schedule/current:
    get:
      tags: [Расписание]
      summary: Расписание текущей недели
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: date
          required: false
          description: "Опорная дата (YYYY-MM-DD). По умолчанию: сегодня (UTC)"
          schema: { type: string, format: date }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/schedule/range:
    get:
      tags: [Расписание]
      summary: Расписание за период
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: date_start
          required: true
          schema: { type: string, format: date }
        - in: query
          name: date_end
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/schedule/version:
    get:
      tags: [Расписание]
      summary: Текущая версия данных расписания
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: object
                required: [data_version]
                properties:
                  data_version:
                    type: string
                    description: Метка времени RFC3339

  /api/v1/schedule/pdf:
    get:
      tags: [Расписание]
      summary: PDF на две недели (неделя 1 + неделя 2)
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: date_start
          required: true
          description: Любая дата первой недели (YYYY-MM-DD)
          schema: { type: string, format: date }
      responses:
        "200":
          description: PDF-документ
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/schedule/xlsx:
    get:
      tags: [Расписание]
      summary: Excel на две недели для конкретной группы
      description: Возвращает структурированный XLSX-файл с расписанием группы на две учебные недели, начиная с понедельника недели date_start.
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: date_start
          required: true
          description: Любая дата первой недели (YYYY-MM-DD); экспорт начнется с понедельника этой недели.
          schema: { type: string, format: date }
      responses:
        "200":
          description: XLSX-файл расписания
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/push/register:
    post:
      tags: [Пуш-уведомления]
      summary: Зарегистрировать токен устройства для группы
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegisterRequest"
      responses:
        "201":
          description: Зарегистрировано
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/push/unregister:
    post:
      tags: [Пуш-уведомления]
      summary: Удалить регистрацию токена устройства
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnregisterRequest"
      responses:
        "204":
          description: Регистрация удалена
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/groups:
    get:
      tags: [Справочники]
      summary: Список групп (публично)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }

  /api/v1/subjects:
    get:
      tags: [Справочники]
      summary: Список дисциплин (публично)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }

  /api/v1/locations:
    get:
      tags: [Справочники]
      summary: Список аудиторий (публично)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }

  /api/v1/campuses:
    get:
      tags: [Справочники]
      summary: Список корпусов (публично)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Campus" }

  /api/v1/location-types:
    get:
      tags: [Справочники]
      summary: Список типов помещений (публично)
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LocationType" }

  /api/v1/admin/groups:
    get:
      tags: [Администрирование]
      summary: Список групп
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      tags: [Администрирование]
      summary: Создать группу (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }

  /api/v1/admin/groups/{id}:
    put:
      tags: [Администрирование]
      summary: Обновить группу (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
    delete:
      tags: [Администрирование]
      summary: Удалить группу (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Удалено }

  /api/v1/admin/subjects:
    get:
      tags: [Администрирование]
      summary: Список дисциплин
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }
    post:
      tags: [Администрирование]
      summary: Создать дисциплину (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Subject" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }

  /api/v1/admin/subjects/{id}:
    put:
      tags: [Администрирование]
      summary: Обновить дисциплину (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Subject" }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
    delete:
      tags: [Администрирование]
      summary: Удалить дисциплину (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Удалено }

  /api/v1/admin/locations:
    get:
      tags: [Администрирование]
      summary: Список аудиторий
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
    post:
      tags: [Администрирование]
      summary: Создать аудиторию (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Location" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }

  /api/v1/admin/locations/{id}:
    put:
      tags: [Администрирование]
      summary: Обновить аудиторию (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Location" }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
    delete:
      tags: [Администрирование]
      summary: Удалить аудиторию (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Удалено }

  /api/v1/admin/campuses:
    get:
      tags: [Администрирование]
      summary: Список корпусов
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Campus" }
    post:
      tags: [Администрирование]
      summary: Создать корпус
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Campus" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campus" }

  /api/v1/admin/campuses/{id}:
    put:
      tags: [Администрирование]
      summary: Обновить корпус
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Campus" }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Campus" }
    delete:
      tags: [Администрирование]
      summary: Удалить корпус
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Удалено }

  /api/v1/admin/location-types:
    get:
      tags: [Администрирование]
      summary: Список типов помещений
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LocationType" }
    post:
      tags: [Администрирование]
      summary: Создать тип помещения
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationType" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationType" }

  /api/v1/admin/location-types/{id}:
    put:
      tags: [Администрирование]
      summary: Обновить тип помещения
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationType" }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationType" }
    delete:
      tags: [Администрирование]
      summary: Удалить тип помещения
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Удалено }

  /api/v1/admin/location-type-links:
    get:
      tags: [Администрирование]
      summary: Список связей аудитория-тип
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: query
          name: location_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: type_id
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LocationTypeLink" }
    post:
      tags: [Администрирование]
      summary: Связать аудиторию с типом
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LocationTypeLink" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LocationTypeLink" }

  /api/v1/admin/location-type-links/{location_id}/{type_id}:
    delete:
      tags: [Администрирование]
      summary: Удалить связь аудитория-тип
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: location_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: type_id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Удалено }

  /api/v1/admin/teachers:
    get:
      tags: [Администрирование]
      summary: Список преподавателей
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Teacher" }
    post:
      tags: [Администрирование]
      summary: Создать преподавателя (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Teacher" }
      responses:
        "201":
          description: Создано
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Teacher" }

  /api/v1/admin/teachers/{id}:
    put:
      tags: [Администрирование]
      summary: Обновить преподавателя (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Teacher" }
      responses:
        "200":
          description: Успешно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Teacher" }
    delete:
      tags: [Администрирование]
      summary: Удалить преподавателя (только администратор)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Удалено }

  /api/v1/admin/teacher-subjects:
    get:
      tags: [Администрирование]
      summary: Список связей преподаватель-дисциплина
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: query
          name: teacher_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: subject_id
          required: false
          schema: { type: integer, minimum: 1 }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
