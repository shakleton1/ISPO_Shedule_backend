openapi: 3.0.3
info:
  title: ISPO Smart Schedule API
  version: 1.0.0
  description: |
    Backend API для системы "Умное расписание" (ИСПО СПбПУ).

servers:
  - url: http://localhost:8080

tags:
  - name: Health
  - name: Auth
  - name: Schedule
  - name: Push
  - name: Dictionaries
  - name: Admin
  - name: Observability

paths:
  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics
      responses:
        "200":
          description: Prometheus metrics text
          content:
            text/plain:
              schema:
                type: string

  /openapi.yaml:
    get:
      tags: [Observability]
      summary: OpenAPI specification (YAML)
      responses:
        "200":
          description: OpenAPI YAML
          content:
            application/yaml:
              schema:
                type: string

  /api/v1/health:
    get:
      tags: [Health]
      summary: Service health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/v1/metrics/health:
    get:
      tags: [Observability]
      summary: Metrics/DB health
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/schedule/current:
    get:
      tags: [Schedule]
      summary: Current week schedule
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: date
          required: false
          description: "Reference date (YYYY-MM-DD). Default: today (UTC)"
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/schedule/range:
    get:
      tags: [Schedule]
      summary: Schedule for date range
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: date_start
          required: true
          schema: { type: string, format: date }
        - in: query
          name: date_end
          required: true
          schema: { type: string, format: date }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekScheduleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/schedule/version:
    get:
      tags: [Schedule]
      summary: Current schedule data version
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [data_version]
                properties:
                  data_version:
                    type: string
                    description: RFC3339 timestamp

  /api/v1/schedule/pdf:
    get:
      tags: [Schedule]
      summary: PDF for two weeks (week1+week2)
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: date_start
          required: true
          description: Any date in week1 (YYYY-MM-DD)
          schema: { type: string, format: date }
      responses:
        "200":
          description: PDF document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/push/register:
    post:
      tags: [Push]
      summary: Register device token for group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushRegisterRequest"
      responses:
        "201":
          description: Registered
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/push/unregister:
    post:
      tags: [Push]
      summary: Unregister device token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnregisterRequest"
      responses:
        "204":
          description: Unregistered
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/groups:
    get:
      tags: [Dictionaries]
      summary: List groups (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }

  /api/v1/subjects:
    get:
      tags: [Dictionaries]
      summary: List subjects (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }

  /api/v1/locations:
    get:
      tags: [Dictionaries]
      summary: List locations (public)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }

  /api/v1/admin/groups:
    get:
      tags: [Admin]
      summary: List groups
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Group" }
    post:
      tags: [Admin]
      summary: Create group (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }

  /api/v1/admin/groups/{id}:
    put:
      tags: [Admin]
      summary: Update group (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Group" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Group" }
    delete:
      tags: [Admin]
      summary: Delete group (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/subjects:
    get:
      tags: [Admin]
      summary: List subjects
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Subject" }
    post:
      tags: [Admin]
      summary: Create subject (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Subject" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }

  /api/v1/admin/subjects/{id}:
    put:
      tags: [Admin]
      summary: Update subject (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Subject" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Subject" }
    delete:
      tags: [Admin]
      summary: Delete subject (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/locations:
    get:
      tags: [Admin]
      summary: List locations
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Location" }
    post:
      tags: [Admin]
      summary: Create location (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Location" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }

  /api/v1/admin/locations/{id}:
    put:
      tags: [Admin]
      summary: Update location (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Location" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Location" }
    delete:
      tags: [Admin]
      summary: Delete location (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/teachers:
    get:
      tags: [Admin]
      summary: List teachers
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Teacher" }
    post:
      tags: [Admin]
      summary: Create teacher (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Teacher" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Teacher" }

  /api/v1/admin/teachers/{id}:
    put:
      tags: [Admin]
      summary: Update teacher (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Teacher" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Teacher" }
    delete:
      tags: [Admin]
      summary: Delete teacher (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/teacher-subjects:
    get:
      tags: [Admin]
      summary: List teacher-subject links
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: query
          name: teacher_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: subject_id
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TeacherSubject" }
    post:
      tags: [Admin]
      summary: Create teacher-subject link (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TeacherSubject" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TeacherSubject" }

  /api/v1/admin/teacher-subjects/{teacher_id}/{subject_id}:
    delete:
      tags: [Admin]
      summary: Delete teacher-subject link (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: teacher_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: path
          name: subject_id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/course-assignments:
    get:
      tags: [Admin]
      summary: List course assignments
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: query
          name: group_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: semester
          required: false
          schema: { type: integer, minimum: 1, maximum: 12 }
        - in: query
          name: subject_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: teacher_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: status
          required: false
          schema: { type: string, enum: [draft, published] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CourseAssignment" }
    post:
      tags: [Admin]
      summary: Create course assignment (dispatcher/admin)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseAssignment" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAssignment" }

  /api/v1/admin/course-assignments/publish:
    post:
      tags: [Admin]
      summary: Publish draft course assignments (dispatcher/admin)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: semester
          required: false
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200": { description: OK }

  /api/v1/admin/course-assignments/discard-drafts:
    post:
      tags: [Admin]
      summary: Discard draft course assignments (dispatcher/admin)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: query
          name: group_id
          required: true
          schema: { type: integer, minimum: 1 }
        - in: query
          name: semester
          required: false
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        "200": { description: OK }

  /api/v1/admin/course-assignments/{id}:
    put:
      tags: [Admin]
      summary: Update course assignment (dispatcher/admin)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseAssignment" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseAssignment" }
    delete:
      tags: [Admin]
      summary: Delete course assignment (dispatcher/admin)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/db/schema:
    get:
      tags: [Admin]
      summary: Atlas-style DB schema diagram (Mermaid HTML)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      responses:
        "200":
          description: HTML page containing Mermaid diagram
          content:
            text/html:
              schema:
                type: string

  /api/v1/admin/specialties:
    get:
      tags: [Admin]
      summary: List specialties
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Specialty" }
    post:
      tags: [Admin]
      summary: Create specialty (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Specialty" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Specialty" }

  /api/v1/admin/specialties/{id}:
    put:
      tags: [Admin]
      summary: Update specialty (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Specialty" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Specialty" }
    delete:
      tags: [Admin]
      summary: Delete specialty (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/curricula:
    get:
      tags: [Admin]
      summary: List curricula
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: query
          name: specialty_id
          required: false
          schema: { type: integer, minimum: 1 }
        - in: query
          name: admission_year
          required: false
          schema: { type: integer, minimum: 2000 }
        - in: query
          name: is_active
          required: false
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Curriculum" }
    post:
      tags: [Admin]
      summary: Create curriculum (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Curriculum" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Curriculum" }

  /api/v1/admin/curricula/{id}:
    put:
      tags: [Admin]
      summary: Update curriculum (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Curriculum" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Curriculum" }
    delete:
      tags: [Admin]
      summary: Delete curriculum (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/curricula/{id}/calendars:
    get:
      tags: [Admin]
      summary: List academic calendars for curriculum
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicCalendar" }
    post:
      tags: [Admin]
      summary: Create academic calendar for curriculum (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcademicCalendar" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AcademicCalendar" }

  /api/v1/admin/calendars/{id}:
    delete:
      tags: [Admin]
      summary: Delete academic calendar (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "204": { description: Deleted }

  /api/v1/admin/calendars/{id}/weeks:
    get:
      tags: [Admin]
      summary: List academic calendar weeks
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicCalendarWeek" }
    put:
      tags: [Admin]
      summary: Upsert academic calendar weeks (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: "#/components/schemas/AcademicCalendarWeek" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AcademicCalendarWeek" }

  /api/v1/admin/curricula/{id}/items:
    get:
      tags: [Admin]
      summary: List curriculum items
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
        - in: query
          name: tree
          required: false
          description: When true, returns items as a hierarchy (parent_id -> children)
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items: { $ref: "#/components/schemas/CurriculumItem" }
                  - type: array
                    items:
                      { $ref: "#/components/schemas/CurriculumItemTreeNode" }
    post:
      tags: [Admin]
      summary: Create curriculum item (admin only)
      security: [{ bearerAuth: [] }, { adminKey: [] }]
      parameters:
        - in: path
