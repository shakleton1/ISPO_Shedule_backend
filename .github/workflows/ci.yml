name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'
          cache: true

      - name: Go toolchain info
        env:
          GOTOOLCHAIN: go1.24.0+auto
        run: |
          go version
          go env GOTOOLCHAIN

      - name: Go version (pre-lint)
        run: |
          which go
          go version

      - name: Download Go modules
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          args: --timeout=10m --print-resources-usage --modules-download-mode=readonly
        env:
          GOTOOLCHAIN: go1.24.0+auto

      - name: Test
        env:
          GOTOOLCHAIN: go1.24.0+auto
        run: go test ./...
