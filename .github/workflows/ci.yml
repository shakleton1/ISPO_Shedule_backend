name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ispo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate OpenAPI spec
        run: |
          python3 -m pip install --disable-pip-version-check --no-cache-dir openapi-spec-validator==0.7.1
          openapi-spec-validator docs/openapi.yaml

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true

      - name: Go toolchain info
        run: |
          go version
          go env GOTOOLCHAIN

      - name: Go version (pre-lint)
        run: |
          which go
          go version

      - name: Download Go modules
        run: go mod download

      - name: Dependency audit (tidy/verify)
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
          go mod verify

      - name: Govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Build Docker image (for scan)
        run: docker build -t ispo-schedule:ci .

      - name: Trivy scan (filesystem)
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            aquasec/trivy:0.49.1 fs \
            --scanners vuln,secret,misconfig \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --no-progress \
            .

      - name: Trivy scan (image)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.49.1 image \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            --ignore-unfixed \
            --no-progress \
            ispo-schedule:ci

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Lint
        run: |
          golangci-lint run --timeout=10m --print-resources-usage --modules-download-mode=readonly

      - name: Test
        run: go test ./...

      - name: Integration smoke (Postgres + migrations)
        env:
          ISPO_TEST_DATABASE_URL: "postgres://postgres:postgres@localhost:5432/ispo_test?sslmode=disable"
        run: go test -tags=integration ./internal/integration -count=1
