server:
  addr: "127.0.0.1:8080"
  read_timeout: "10s"
  write_timeout: "10s"

  # HTTP hardening
  # - read_header_timeout: protects against slowloris / slow headers
  # - idle_timeout: limits keep-alive idle connections
  # - max_header_bytes: maximum size of request headers
  read_header_timeout: "5s"
  idle_timeout: "60s"
  max_header_bytes: 1048576 # 1 MiB

  # Upload/import body size limit (bytes). Applied to heavy endpoints like admin import.
  admin_import_max_body_bytes: 26214400 # 25 MiB

  # CORS (для Web фронта на другом origin).
  # По умолчанию CORS выключен (allowed_origins пустой).
  cors:
    allowed_origins: []
    # Пример:
    # allowed_origins: ["https://admin.example.com", "http://localhost:3000"]
    allow_credentials: false
    # allowed_methods/headers можно не задавать — будут безопасные дефолты.
    allowed_methods: ""
    allowed_headers: ""
    exposed_headers: ""

  # Rate limiting (token bucket, per-IP). Useful to protect heavy endpoints.
  # If enabled, tune these based on expected traffic.
  rate_limit:
    login:
      enabled: true
      rps: 0.2 # ~12 requests/minute
      burst: 5
    schedule_pdf:
      enabled: true
      rps: 0.1 # ~6 requests/minute
      burst: 2
    admin_import:
      enabled: true
      rps: 0.02 # ~1.2 requests/minute
      burst: 1

log:
  level: "info" # trace|debug|info|warn|error|fatal|panic
  pretty: true # console output for dev

db:
  host: "localhost"
  port: 5432
  user: "postgres"
  password: "postgres"
  name: "ispo_schedule"
  sslmode: "disable"

schedule:
  # Дата начала семестра. От нее считается четность недель.
  # ВНИМАНИЕ: по спецификации week_diff=0 считается "denominator".
  semester_start_date: "2026-02-09"

admin:
  # Если пусто, админ-эндпоинты не защищены ключом (dev).
  api_key: ""

auth:
  # JWT secret для подписи access token (HMAC). В проде должен быть длинным и случайным.
  jwt_secret: "dev-secret-change-me"
  access_token_ttl: "12h"
  refresh_token_ttl: "720h" # 30 days
  # Bootstrap админа при старте (если такого логина еще нет).
  bootstrap_admin_login: "admin"
  bootstrap_admin_password: "admin123"

push:
  enabled: false
  fcm:
    enabled: true
    # ID проекта Firebase (Project ID).
    project_id: ""
    # Путь к service account JSON (Google Cloud / Firebase).
    credentials_file: ""
    timeout: "5s"

pdf:
  # Опционально: путь к chrome.exe, если chromedp не находит браузер.
  chrome_executable_path: ""
  timeout: "20s"
